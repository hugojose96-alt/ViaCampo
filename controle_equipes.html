<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Via Campo — Controle de Equipes</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a2070;font-family:'Segoe UI',sans-serif;color:#fff;min-height:100vh}
.header{background:#1e277a;padding:11px 28px;border-bottom:2px solid #3d48c0;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:6px}
.brand-sub{font-size:10px;color:#a0aadd;letter-spacing:2px;text-transform:uppercase;margin-top:1px}
.header-right{text-align:right;font-size:12px;color:#a0aadd}
.header-right strong{display:block;color:#e8c040;font-size:13px}
.body{padding:18px 28px}
.status-bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:#4ade80;animation:pulse 2s infinite;flex-shrink:0}
.dot.err{background:#f87171;animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.status-text{color:#a0aadd}
.refresh-btn{margin-left:auto;background:rgba(232,192,64,0.15);color:#e8c040;border:1px solid rgba(232,192,64,0.4);border-radius:6px;padding:4px 12px;font-size:11px;cursor:pointer;font-family:'Segoe UI',sans-serif;font-weight:600}
.refresh-btn:hover{background:rgba(232,192,64,0.28)}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabbtn{background:transparent;color:#7888c0;border:1px solid #3d48c0;border-radius:6px;padding:7px 18px;font-size:12px;cursor:pointer;font-family:'Segoe UI',sans-serif;font-weight:700;letter-spacing:.3px}
.tabbtn:hover{background:#2d38b0;color:#fff}
.tabbtn.active{background:rgba(232,192,64,0.15);color:#e8c040;border-color:#e8c040}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.kpi{background:#1e277a;border-radius:9px;padding:12px 14px;border:1px solid #3d48c0}
.kpi-label{font-size:10px;color:#a0aadd;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
.kpi-value{font-size:21px;font-weight:700;color:#fff}
.kpi-value span{font-size:12px;font-weight:400;color:#a0aadd;margin-left:3px}
.kpi-badge{display:inline-block;margin-top:3px;font-size:10px;padding:2px 7px;border-radius:20px}
.bb{background:rgba(96,165,250,0.15);color:#93c5fd}
.bg{background:rgba(232,192,64,0.15);color:#e8c040}
.bn{background:rgba(74,222,128,0.15);color:#4ade80}
.bp{background:rgba(167,139,250,0.15);color:#a78bfa}
.br{background:rgba(248,113,113,0.15);color:#f87171}
.filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center;background:#1e277a;padding:10px 14px;border-radius:8px;border:1px solid #3d48c0}
.fl{font-size:10px;color:#a0aadd;font-weight:700;letter-spacing:1px;text-transform:uppercase;white-space:nowrap}
select{background:#2B34A0;color:#fff;border:1px solid #4d5cd0;border-radius:6px;padding:5px 9px;font-size:11px;outline:none;cursor:pointer;font-family:'Segoe UI',sans-serif}
select:focus{border-color:#e8c040}
.fc{background:transparent;color:#7888c0;border:1px solid #3d48c0;border-radius:6px;padding:5px 10px;font-size:11px;cursor:pointer;font-family:'Segoe UI',sans-serif}
.fc:hover{background:#2d38b0;color:#fff}
.fcount{margin-left:auto;font-size:10px;color:#5060a0}
.cb{background:#1e277a;border-radius:9px;padding:14px 16px;border:1px solid #3d48c0;margin-bottom:12px}
.ct{font-size:11px;font-weight:600;color:#d0d8f0;letter-spacing:.5px;text-transform:uppercase;margin-bottom:2px}
.cs{font-size:10px;color:#7888c0;margin-bottom:8px}
.tw{overflow:auto;max-height:340px;border-radius:5px}
.tw::-webkit-scrollbar{width:5px;height:5px}.tw::-webkit-scrollbar-track{background:#1a2070}.tw::-webkit-scrollbar-thumb{background:#3d48c0;border-radius:3px}
table{width:100%;border-collapse:collapse;font-size:11px}
thead th{background:#16206a;color:#a0aadd;padding:6px 9px;text-align:left;border-bottom:2px solid #2d38b0;font-weight:600;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap;position:sticky;top:0;z-index:2}
td{padding:5px 9px;border-bottom:1px solid rgba(255,255,255,0.05);color:#d0d8f0;white-space:nowrap}
tr:hover td{background:rgba(255,255,255,0.03)}
.bs{display:inline-block;padding:1px 6px;border-radius:9px;font-size:10px;font-weight:600}
.r1{background:rgba(96,165,250,0.2);color:#93c5fd}.r2{background:rgba(232,192,64,0.2);color:#e8c040}
.pbar{width:100%;min-width:70px;height:8px;background:#141a5c;border-radius:4px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:4px}
.pctcell{display:flex;align-items:center;gap:8px}
.pctnum{font-weight:700;min-width:34px;text-align:right}
.loading{display:flex;align-items:center;justify-content:center;height:180px;flex-direction:column;gap:10px;color:#7888c0;font-size:13px}
.spinner{width:28px;height:28px;border:3px solid #2d38b0;border-top-color:#e8c040;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.footer{text-align:center;padding:8px;font-size:11px;color:#8898cc;border-top:1px solid #2d38b0;margin-top:4px;letter-spacing:.5px}
.empty{text-align:center;padding:30px;color:#5060a0;font-size:13px}
</style>
</head>

<script>
document.getElementById('hDate').textContent=new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});

// ── FONTES DE DADOS ───────────────────────────────────────────────
// 1) REALIZADO (RDO): vem do rdo-recursos.json, atualizado diariamente no Google Drive.
//    O arquivo é entregue por um Google Apps Script (veja apps_script_rdo.gs).
//    Cole abaixo a URL do aplicativo da web (termina em /exec).
const RDO_API_URL='COLE_AQUI_A_URL_DO_APPS_SCRIPT';

// 2) QUADRO DE REFERÊNCIA (quantidade que cada equipe deve ter): continua na planilha.
//    Apenas as colunas P em diante são lidas. As colunas A–O da planilha não são mais usadas.
const CSV_URLS=[
  'https://docs.google.com/spreadsheets/d/1vCZUNIql89FbqEdfgeI_dvghB03m3IMuNGJGUJ4RPZ4/gviz/tq?tqx=out:csv&gid=1771563466',
  'https://docs.google.com/spreadsheets/d/e/2PACX-1vSWOUerAj_cWfsIW3nLs2aXB-e2V-SKFg6bruMoP1Ti_pEr7pKiT9Oio0um9g5okJdnbICre7oDZyEj/pub?gid=1771563466&single=true&output=csv'
];
// Quadro de referência (planilha):
// P=15 Equipe(mestre) | Q=16 Oficial(esp) | R=17 Líder(esp) | S=18 Ajudante(esp)
// T=19 Gerador(esp) | U=20 Betoneira(esp) | V=21 Roçadeira(esp) | W=22 Moto Serra(esp)
// X=23 Triturador(esp) | Y=24 Motopoda(esp) | Z=25 Caminhão Munck(esp) | AA=26 Caminhão 3/4(esp)
//
// Realizado (rdo-recursos.json): as colunas são lidas pelo NOME (Oficial, Líder de Equipe,
// Ajudante, Gerador, Betoneira, Roçadeira, Moto Serra, Triturador, Motopoda,
// Caminhão Munck, Caminhão 3/4), então mudanças de posição no JSON não deslocam os dados.

// mes: null = ainda não definido (na primeira carga vira o mês mais recente do JSON)
let AD=null, AF={equipe:'all',mes:null,data:'all'}, TAB='pessoal';

const ROLES=[
  {k:'oficial',lbl:'Oficial'},
  {k:'lider',lbl:'Líder de Equipe'},
  {k:'ajudante',lbl:'Ajudante'}
];
const EQUIPMENTS=[
  {k:'gerador',lbl:'Gerador'},
  {k:'betoneira',lbl:'Betoneira'},
  {k:'rocadeira',lbl:'Roçadeira'},
  {k:'motoserra',lbl:'Moto Serra'},
  {k:'triturador',lbl:'Triturador'},
  {k:'motopoda',lbl:'Motopoda'},
  {k:'caminhaomunck',lbl:'Caminhão Munck'},
  {k:'caminhao34',lbl:'Caminhão 3/4'}
];
const TABS=[
  {key:'pessoal',label:'👷 Funcionários',fields:ROLES,
    getReal:(r,k)=>r[k], getEsp:(mm,k)=>mm[k],
    itemNome:'Efetivo', descReal:'RDO', descEsp:'planilha Q–S'},
  {key:'equip',label:'🚜 Equipamentos',fields:EQUIPMENTS,
    getReal:(r,k)=>r.equip[k], getEsp:(mm,k)=>mm.equip[k],
    itemNome:'Equipamento', descReal:'RDO', descEsp:'planilha T–AA'}
];
const PALETTE=['#93c5fd','#a78bfa','#fb923c','#4ade80','#f472b6','#38bdf8','#facc15','#f87171'];

function sl(l){
  const r=[];let c='',q=false;
  for(let i=0;i<l.length;i++){
    const ch=l[i];
    if(ch==='"'){if(q&&l[i+1]==='"'){c+='"';i++;}else q=!q;}
    else if(ch===','&&!q){r.push(c.trim());c='';}
    else c+=ch;
  }
  r.push(c.trim());return r;
}
function pn(s){if(!s||!s.trim())return 0;const c=s.replace(/[^\d,.\-]/g,'');if(c.includes(',')&&c.includes('.'))return parseFloat(c.replace(/\./g,'').replace(',','.'))||0;if(c.includes(','))return parseFloat(c.replace(',','.'))||0;return parseFloat(c)||0;}
function norm(s){return (s||'').toLowerCase().replace(/-/g,' ').replace(/\s+/g,' ').trim();}
function parseData(s){const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec((s||'').trim());if(!m)return null;return new Date(+m[3],+m[2]-1,+m[1]);}
function regional(nome){const m=/^(Reg\s*\d+)/i.exec(nome||'');return m?m[1].replace(/\s+/g,' '):'—';}

const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function mesLabel(k){const p=(k||'').split('-');return p.length===2?MESES[+p[1]-1]+'/'+p[0]:k;}
function isoParaData(s){const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(s||'').trim());if(!m)return null;return {dataObj:new Date(+m[1],+m[2]-1,+m[3]),dataStr:m[3]+'/'+m[2]+'/'+m[1],mesKey:m[1]+'-'+m[2]};}
function mesPadrao(){if(!AD)return 'all';const ms=[...new Set(AD.registros.map(r=>r.mesKey))].sort();return ms.length?ms[ms.length-1]:'all';}
function nk(s){return norm(String(s==null?'':s)).normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function num(v){if(typeof v==='number')return isFinite(v)?v:0;return pn(v==null?'':String(v));}

async function fetchTexto(url){
  const sep=url.includes('?')?'&':'?';
  const res=await fetch(url+sep+'t='+Date.now());
  if(!res.ok)throw new Error('HTTP '+res.status);
  return res.text();
}
async function carregarRDO(){
  if(!RDO_API_URL||/^COLE_AQUI/.test(RDO_API_URL))throw new Error('defina a URL do Apps Script em RDO_API_URL');
  const t=await fetchTexto(RDO_API_URL);
  let j;
  try{j=JSON.parse(t);}catch(e){throw new Error('o Apps Script não devolveu JSON (confira se a implantação está com acesso "Qualquer pessoa")');}
  if(j&&j.erro)throw new Error(j.erro);
  if(!j||!Array.isArray(j.colunas)||!Array.isArray(j.linhas))throw new Error('formato inesperado no rdo-recursos.json');
  return j;
}
async function carregarQuadro(){
  let lastErr=null;
  for(const url of CSV_URLS){
    try{
      const t=await fetchTexto(url);
      if(t && t.trim().length && !/^\s*<(!DOCTYPE|html)/i.test(t))return t;
      lastErr=new Error('resposta vazia ou não é CSV');
    }catch(e){lastErr=e;}
  }
  throw lastErr||new Error('nenhuma fonte respondeu');
}

async function loadAll(){
  document.getElementById('sDot').className='dot';
  document.getElementById('sTxt').textContent='Conectando...';
  document.getElementById('mc').innerHTML='<div class="loading"><div class="spinner"></div>Carregando dados...</div>';
  try{
    const [rdo,csv]=await Promise.all([
      carregarRDO().catch(e=>{throw new Error('RDO: '+e.message);}),
      carregarQuadro().catch(e=>{throw new Error('quadro de referência: '+e.message);})
    ]);

    // ── Quadro de referência (planilha, colunas P em diante) ──
    const master={};   // norm(nome) -> {nome,oficial,lider,ajudante,equip:{...}}
    csv.split('\n').map(l=>l.replace(/\r$/,'')).filter(l=>l.trim().length).forEach(line=>{
      const f=sl(line);
      if(f[15] && f[15].trim() && norm(f[15])!=='equipes'){
        const nome=f[15].trim();
        master[norm(nome)]={
          nome,
          oficial:pn(f[16]), lider:pn(f[17]), ajudante:pn(f[18]),
          equip:{
            gerador:pn(f[19]), betoneira:pn(f[20]), rocadeira:pn(f[21]),
            motoserra:pn(f[22]), triturador:pn(f[23]), motopoda:pn(f[24]),
            caminhaomunck:pn(f[25]), caminhao34:pn(f[26])
          }
        };
      }
    });

    // ── Realizado (rdo-recursos.json), colunas localizadas pelo nome ──
    const idx={};
    rdo.colunas.forEach((c,i)=>{const k=nk(c);if(!(k in idx))idx[k]=i;});
    const NOMES={serial:'Serial do RDO',equipe:'Equipe',data:'Data',oficial:'Oficial',lider:'Líder de Equipe',ajudante:'Ajudante',
      gerador:'Gerador',betoneira:'Betoneira',rocadeira:'Roçadeira',motoserra:'Moto Serra',triturador:'Triturador',motopoda:'Motopoda',
      caminhaomunck:'Caminhão Munck',caminhao34:'Caminhão 3/4'};
    const C={}, faltam=[];
    Object.keys(NOMES).forEach(k=>{const i=idx[nk(NOMES[k])];if(i===undefined)faltam.push(NOMES[k]);else C[k]=i;});
    if(faltam.length)throw new Error('colunas ausentes no rdo-recursos.json: '+faltam.join(', '));

    const registros=[]; // {serial,equipe,dataStr,dataObj,mesKey,oficial,lider,ajudante,equip:{...}}
    rdo.linhas.forEach(l=>{
      const d=isoParaData(l[C.data]);
      const eq=l[C.equipe];
      if(!d || eq==null || !String(eq).trim())return;
      registros.push({
        serial:l[C.serial], equipe:String(eq).trim(), dataStr:d.dataStr, dataObj:d.dataObj, mesKey:d.mesKey,
        oficial:num(l[C.oficial]), lider:num(l[C.lider]), ajudante:num(l[C.ajudante]),
        equip:{
          gerador:num(l[C.gerador]), betoneira:num(l[C.betoneira]), rocadeira:num(l[C.rocadeira]),
          motoserra:num(l[C.motoserra]), triturador:num(l[C.triturador]), motopoda:num(l[C.motopoda]),
          caminhaomunck:num(l[C.caminhaomunck]), caminhao34:num(l[C.caminhao34])
        }
      });
    });

    AD={master,registros,atualizadoEm:rdo.atualizadoEm||''};
    const meses=new Set(registros.map(r=>r.mesKey));
    if(AF.mes===null || (AF.mes!=='all' && !meses.has(AF.mes)))AF.mes=mesPadrao();
    document.getElementById('sDot').className='dot';
    document.getElementById('sTxt').textContent=`Conectado — ${registros.length} registros do RDO · ${Object.keys(master).length} equipes no quadro · RDO atualizado em ${AD.atualizadoEm||'—'} · carregado às ${new Date().toLocaleTimeString('pt-BR')}`;
    render();
  }catch(err){
    document.getElementById('sDot').className='dot err';
    document.getElementById('sTxt').textContent='Erro ao carregar: '+err.message;
    document.getElementById('mc').innerHTML='<div class="empty">Não foi possível carregar os dados.<br>Confira a URL e a implantação do Apps Script (rdo-recursos.json) e o link publicado da planilha do quadro de referência.</div>';
  }
}

function compute(tabKey,registrosOverride){
  const tab=TABS.find(t=>t.key===tabKey);
  const {master}=AD;
  const registros=registrosOverride||AD.registros;
  const stats={}; // nomeCanonico -> {regional,total,divergente,faltando:{campo:qtd}}
  const faltas=[]; // detalhamento

  registros.forEach(r=>{
    const mm=master[norm(r.equipe)];
    if(!mm)return;
    const canon=mm.nome;
    if(!stats[canon]){
      stats[canon]={regional:regional(canon),total:0,divergente:0,faltando:{}};
      tab.fields.forEach(f=>{stats[canon].faltando[f.k]=0;});
    }
    const st=stats[canon];
    st.total++;
    let anyFalta=false;
    tab.fields.forEach((f,idx)=>{
      const real=tab.getReal(r,f.k), esp=tab.getEsp(mm,f.k);
      // Só conta como divergência quando falta (real < esperado) E o esperado é maior que zero.
      // Quando o previsto é 0, não há o que faltar, então não é divergência.
      // Quantidade acima do esperado (sobra) também é ignorada — não é tratada como problema.
      if(esp>0 && real<esp){
        anyFalta=true; st.faltando[f.k]+=(esp-real);
        faltas.push({dataStr:r.dataStr,dataObj:r.dataObj,equipe:canon,regional:regional(canon),campo:f.lbl,cor:PALETTE[idx%PALETTE.length],real,esp,faltando:esp-real,serial:r.serial});
      }
    });
    if(anyFalta)st.divergente++;
  });

  faltas.sort((a,b)=>b.dataObj-a.dataObj || a.equipe.localeCompare(b.equipe));
  return {stats,faltas,tab};
}

function pctColor(p){return p===0?'#4ade80':p<34?'#4ade80':p<67?'#fb923c':'#f87171';}

function switchTab(key){TAB=key;render();}

function render(){
  if(!AD||!AD.registros.length){document.getElementById('mc').innerHTML='<div class="empty">Sem dados disponíveis.<br>Verifique o rdo-recursos.json e a planilha do quadro de referência.</div>';return;}

  // Mês: define o período analisado (KPIs, gráfico, ranking e detalhamento)
  const meses=[...new Set(AD.registros.map(r=>r.mesKey))].sort().reverse();
  if(AF.mes===null||(AF.mes!=='all'&&!meses.includes(AF.mes)))AF.mes=mesPadrao();
  const registrosMes=AF.mes==='all'?AD.registros:AD.registros.filter(r=>r.mesKey===AF.mes);
  const mesTxt=AF.mes==='all'?'todos os meses':mesLabel(AF.mes);

  const {stats,faltas,tab}=compute(TAB,registrosMes);
  const equipes=Object.keys(stats).sort();
  const datas=[...new Set(registrosMes.map(r=>r.dataStr))].sort((a,b)=>parseData(b)-parseData(a));
  const tituloTab=tab.key==='pessoal'?'Efetivo':'Equipamento';
  // Filtros de equipe/dia que deixaram de existir no mês escolhido voltam para "todos"
  if(AF.equipe!=='all'&&!equipes.includes(AF.equipe))AF.equipe='all';
  if(AF.data!=='all'&&!datas.includes(AF.data))AF.data='all';

  // Filtros aplicados ao detalhamento de faltas
  const faltasF=faltas.filter(f=>(AF.equipe==='all'||f.equipe===AF.equipe)&&(AF.data==='all'||f.dataStr===AF.data));

  // KPIs gerais (baseados no mês escolhido; não mudam com os filtros de equipe/dia)
  const totalEquipes=equipes.length;
  const totalDias=equipes.reduce((a,e)=>a+stats[e].total,0);
  const totalDivergentes=equipes.reduce((a,e)=>a+stats[e].divergente,0);
  const pctGeral=totalDias?Math.round(totalDivergentes/totalDias*1000)/10:0;
  const rankingGeral=equipes.map(e=>({nome:e,...stats[e],pct:stats[e].total?Math.round(stats[e].divergente/stats[e].total*1000)/10:0}))
    .sort((a,b)=>b.pct-a.pct||b.total-a.total);
  const maisDivergente=rankingGeral[0];
  const maisConsistente=[...rankingGeral].sort((a,b)=>a.pct-b.pct||b.total-a.total)[0];

  // Registros do mês filtrados por equipe/dia (mesmo filtro do detalhamento), usados no gráfico e no ranking abaixo
  const registrosF=registrosMes.filter(r=>{
    const mm=AD.master[norm(r.equipe)];
    const canon=mm?mm.nome:r.equipe;
    return (AF.equipe==='all'||canon===AF.equipe)&&(AF.data==='all'||r.dataStr===AF.data);
  });
  const statsF=compute(TAB,registrosF).stats;
  const ranking=Object.keys(statsF).sort().map(e=>({nome:e,...statsF[e],pct:statsF[e].total?Math.round(statsF[e].divergente/statsF[e].total*1000)/10:0}))
    .sort((a,b)=>b.pct-a.pct||b.total-a.total);

  document.getElementById('mc').innerHTML=`
  <div class="tabs">
    ${TABS.map(t=>`<button class="tabbtn${TAB===t.key?' active':''}" onclick="switchTab('${t.key}')">${t.label}</button>`).join('')}
  </div>

  <div class="kpi-row">
    <div class="kpi"><div class="kpi-label">Equipes no quadro</div><div class="kpi-value">${totalEquipes} <span>equipes</span></div><div class="kpi-badge bb">${totalDias} dias-equipe analisados</div></div>
    <div class="kpi"><div class="kpi-label">% Geral com divergência</div><div class="kpi-value">${pctGeral}<span>%</span></div><div class="kpi-badge ${pctGeral>66?'br':pctGeral>33?'bg':'bn'}">${totalDivergentes} de ${totalDias} dias</div></div>
    <div class="kpi"><div class="kpi-label">Equipe mais consistente</div><div class="kpi-value" style="font-size:14px">${maisConsistente?maisConsistente.nome:'—'}</div><div class="kpi-badge bn">${maisConsistente?maisConsistente.pct:0}% divergente</div></div>
    <div class="kpi"><div class="kpi-label">Equipe mais divergente</div><div class="kpi-value" style="font-size:14px">${maisDivergente?maisDivergente.nome:'—'}</div><div class="kpi-badge br">${maisDivergente?maisDivergente.pct:0}% divergente</div></div>
  </div>

  <div class="filters">
    <span class="fl">Filtros (equipe / mês / dia):</span>
    <select id="fEquipe" onchange="applyF()"><option value="all">Todas as equipes</option>${equipes.map(e=>`<option value="${e}"${AF.equipe===e?' selected':''}>${e}</option>`).join('')}</select>
    <select id="fMes" onchange="applyF()"><option value="all">Todos os meses</option>${meses.map(m=>`<option value="${m}"${AF.mes===m?' selected':''}>${mesLabel(m)}</option>`).join('')}</select>
    <select id="fData" onchange="applyF()"><option value="all">Todas as datas</option>${datas.map(d=>`<option value="${d}"${AF.data===d?' selected':''}>${d}</option>`).join('')}</select>
    <button class="fc" onclick="clearF()">Limpar</button>
    <span class="fcount">${faltasF.length} de ${faltas.length} faltas</span>
  </div>

  <div class="cb">
    <div class="ct">% de Dias com ${tituloTab} Divergente por Equipe</div>
    <div class="cs">Comparação entre ${tab.key==='pessoal'?'efetivo real':'equipamentos realizados'} (${tab.descReal}) e quadro de referência (${tab.descEsp}) · barra = % de dias divergentes · ${mesTxt}${(AF.equipe!=='all'||AF.data!=='all')?' · <span style="color:#e8c040">filtro ativo</span>':''}</div>
    <div style="position:relative;height:${Math.max(220,ranking.length*22)}px"><canvas id="cRank">.</canvas></div>
  </div>

  <div class="cb">
    <div class="ct">Ranking por Equipe</div><div class="cs">${ranking.length} equipe${ranking.length===1?'':'s'} · ordenado por % de divergência · ${mesTxt}${(AF.equipe!=='all'||AF.data!=='all')?' · <span style="color:#e8c040">filtro ativo</span>':''}</div>
    <div class="tw">
      <table>
        <thead><tr><th>Equipe</th><th>Regional</th><th>Dias analisados</th><th>Dias divergentes</th><th>% Divergente</th>${tab.fields.map(f=>`<th>${f.lbl} faltou</th>`).join('')}</tr></thead>
        <tbody>${ranking.length?ranking.map(r=>`<tr>
          <td>${r.nome}</td>
          <td><span class="bs ${r.regional==='Reg 1'?'r1':'r2'}">${r.regional}</span></td>
          <td>${r.total}</td>
          <td>${r.divergente}</td>
          <td><div class="pctcell"><div class="pbar"><i style="width:${r.pct}%;background:${pctColor(r.pct)}"></i></div><span class="pctnum" style="color:${pctColor(r.pct)}">${r.pct}%</span></div></td>
          ${tab.fields.map(f=>`<td>${r.faltando[f.k]}x</td>`).join('')}
        </tr>`).join(''):`<tr><td colspan="${5+tab.fields.length}" style="text-align:center;color:#5060a0;padding:20px">Nenhum registro encontrado para o filtro selecionado.</td></tr>`}</tbody>
      </table>
    </div>
  </div>

  <div class="cb">
    <div class="ct">Detalhamento de Faltas por Dia</div><div class="cs">Casos em que ${tab.key==='pessoal'?'o efetivo real':'os equipamentos realizados'} ficaram abaixo do quadro de referência · ${faltasF.length} registros</div>
    <div class="tw">
      <table>
        <thead><tr><th>Data</th><th>Equipe</th><th>Regional</th><th>${tab.itemNome}</th><th>Real</th><th>Esperado</th><th>Faltando</th></tr></thead>
        <tbody>${faltasF.length?faltasF.map(f=>`<tr>
          <td>${f.dataStr}</td>
          <td>${f.equipe}</td>
          <td><span class="bs ${f.regional==='Reg 1'?'r1':'r2'}">${f.regional}</span></td>
          <td><span class="bs" style="background:${f.cor}33;color:${f.cor}">${f.campo}</span></td>
          <td>${f.real}</td>
          <td>${f.esp}</td>
          <td style="font-weight:700;color:#f87171">-${f.faltando}</td>
        </tr>`).join(''):'<tr><td colspan="7" style="text-align:center;color:#5060a0;padding:20px">Nenhuma falta encontrada para o filtro selecionado.</td></tr>'}</tbody>
      </table>
    </div>
  </div>`;

  const ctx=document.getElementById('cRank');
  if(ctx){
    new Chart(ctx,{type:'bar',data:{labels:ranking.map(r=>r.nome),datasets:[{data:ranking.map(r=>r.pct),backgroundColor:ranking.map(r=>pctColor(r.pct)+'cc'),borderColor:ranking.map(r=>pctColor(r.pct)),borderWidth:1.5,borderRadius:4}]},
      options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.parsed.x}% dos dias divergentes`}}},
      scales:{x:{min:0,max:100,ticks:{color:'#8898cc',font:{size:10},callback:v=>v+'%'},grid:{color:'rgba(255,255,255,0.07)'}},y:{ticks:{color:'#8898cc',font:{size:10}},grid:{display:false}}}}});
  }
}

function applyF(){
  const mes=document.getElementById('fMes').value;
  const mudouMes=mes!==AF.mes;
  AF.equipe=document.getElementById('fEquipe').value;
  AF.mes=mes;
  AF.data=mudouMes?'all':document.getElementById('fData').value; // trocar o mês zera o filtro de dia
  render();
}
function clearF(){AF={equipe:'all',mes:AF.mes,data:'all'};render();} // mantém o mês escolhido
loadAll();
</script>
