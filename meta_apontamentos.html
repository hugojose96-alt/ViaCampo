<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Via Campo — Meta de Apontamentos por Equipe</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a2070;font-family:'Segoe UI',sans-serif;color:#fff;min-height:100vh}
.header{background:#1e277a;padding:11px 28px;border-bottom:2px solid #3d48c0;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:6px}
.brand-sub{font-size:10px;color:#a0aadd;letter-spacing:2px;text-transform:uppercase;margin-top:1px}
.header-right{text-align:right;font-size:12px;color:#a0aadd}
.header-right strong{display:block;color:#e8c040;font-size:13px}
.body{padding:18px 28px}
.status-bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:#4ade80;animation:pulse 2s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.dot.err{background:#f87171}
.status-text{color:#a0aadd}
.refresh-btn{margin-left:auto;background:rgba(232,192,64,0.15);color:#e8c040;border:1px solid rgba(232,192,64,0.4);border-radius:6px;padding:4px 12px;font-size:11px;cursor:pointer;font-family:'Segoe UI',sans-serif;font-weight:600}
.refresh-btn:hover{background:rgba(232,192,64,0.28)}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.kpi{background:#1e277a;border-radius:9px;padding:12px 14px;border:1px solid #3d48c0}
.kpi-label{font-size:10px;color:#a0aadd;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
.kpi-value{font-size:21px;font-weight:700;color:#fff}
.kpi-value span{font-size:12px;font-weight:400;color:#a0aadd;margin-left:3px}
.kpi-badge{display:inline-block;margin-top:3px;font-size:10px;padding:2px 7px;border-radius:20px}
.bb{background:rgba(96,165,250,0.15);color:#93c5fd}
.bg{background:rgba(232,192,64,0.15);color:#e8c040}
.bn{background:rgba(74,222,128,0.15);color:#4ade80}
.bp{background:rgba(167,139,250,0.15);color:#a78bfa}
.br{background:rgba(248,113,113,0.15);color:#f87171}
.filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center;background:#1e277a;padding:10px 14px;border-radius:8px;border:1px solid #3d48c0}
.fl{font-size:10px;color:#a0aadd;font-weight:700;letter-spacing:1px;text-transform:uppercase;white-space:nowrap}
select{background:#2B34A0;color:#fff;border:1px solid #4d5cd0;border-radius:6px;padding:5px 9px;font-size:11px;outline:none;cursor:pointer;font-family:'Segoe UI',sans-serif;max-width:220px}
select:focus{border-color:#e8c040}
.chk{display:flex;align-items:center;gap:5px;font-size:11px;color:#c0c8e8;cursor:pointer;user-select:none}
.chk input{cursor:pointer}
.fc{background:transparent;color:#7888c0;border:1px solid #3d48c0;border-radius:6px;padding:5px 10px;font-size:11px;cursor:pointer;font-family:'Segoe UI',sans-serif}
.fc:hover{background:#2d38b0;color:#fff}
.fcount{margin-left:auto;font-size:10px;color:#5060a0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.cb{background:#1e277a;border-radius:9px;padding:14px 16px;border:1px solid #3d48c0;margin-bottom:12px}
.ct{font-size:11px;font-weight:600;color:#d0d8f0;letter-spacing:.5px;text-transform:uppercase;margin-bottom:2px}
.cs{font-size:10px;color:#7888c0;margin-bottom:8px}
.leg{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:7px}
.leg span{display:flex;align-items:center;gap:4px;font-size:10px;color:#a0aadd}
.ld{width:9px;height:9px;border-radius:2px;flex-shrink:0}
.tw{overflow-y:auto;max-height:420px;border-radius:5px}
.tw::-webkit-scrollbar{width:5px}.tw::-webkit-scrollbar-track{background:#1a2070}.tw::-webkit-scrollbar-thumb{background:#3d48c0;border-radius:3px}
table{width:100%;border-collapse:collapse;font-size:11px}
thead th{background:#16206a;color:#a0aadd;padding:6px 9px;text-align:left;border-bottom:2px solid #2d38b0;font-weight:600;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap;position:sticky;top:0;z-index:2}
td{padding:5px 9px;border-bottom:1px solid rgba(255,255,255,0.05);color:#d0d8f0;white-space:nowrap}
tr:hover td{background:rgba(255,255,255,0.03)}
.bs{display:inline-block;padding:1px 7px;border-radius:9px;font-size:10px;font-weight:600}
.r1{background:rgba(96,165,250,0.2);color:#93c5fd}.r2{background:rgba(232,192,64,0.2);color:#e8c040}
.ti{background:rgba(74,222,128,0.2);color:#4ade80}.tt2{background:rgba(167,139,250,0.2);color:#a78bfa}
.sok{background:rgba(74,222,128,0.2);color:#4ade80}.salert{background:rgba(248,113,113,0.2);color:#f87171}.snm{background:rgba(160,170,221,0.2);color:#a0aadd}
.loading{display:flex;align-items:center;justify-content:center;height:180px;flex-direction:column;gap:10px;color:#7888c0;font-size:13px}
.spinner{width:28px;height:28px;border:3px solid #2d38b0;border-top-color:#e8c040;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.footer{text-align:center;padding:8px;font-size:11px;color:#8898cc;border-top:1px solid #2d38b0;margin-top:4px;letter-spacing:.5px}
.empty{text-align:center;padding:30px;color:#5060a0;font-size:13px}
.err-box{background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.4);border-radius:8px;padding:14px 16px;color:#fca5a5;font-size:12px;line-height:1.6}
</style>
</head>

<div class="header">
  <div class="brand">
    <img style="height:50px;border-radius:6px" id="hLogo" alt="Via Campo">
    <div>
      <div class="brand-sub">Meta de Apontamentos</div>
    </div>
  </div>
  <div class="header-right"><strong id="hDate">—</strong>Acompanhamento Diário por Equipe / Regional</div>
</div>

<div style="background:#182060;padding:6px 28px;font-size:10px;color:#5060a0;letter-spacing:2px;text-transform:uppercase;border-bottom:1px solid #2d38b0">META DE APONTAMENTOS — DADOS AO VIVO DA PLANILHA (KARTADO)</div>

<div class="body">

</div>

  equipes:`https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=1360967273`,
  meta:`https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=648165687`
};
let CH={},AF={reg:'all',tipo:'all',resp:'all',equipe:'all'},SEL_DATE=null;
let TEAMS=[],DAYROWS=[],META_KO=false;
const CL=['#60a5fa','#e8c040','#4ade80','#f87171','#a78bfa','#fb923c'];
const GC='rgba(255,255,255,0.07)',TC='#8898cc';

// ---------- CSV parser (RFC4180-ish, handles quotes/newlines/commas) ----------
function parseCSV(text){
  const rows=[];let row=[];let field='';let inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'){
        if(text[i+1]==='"'){field+='"';i++;}else{inQ=false;}
      }else field+=c;
    }else{
      if(c==='"') inQ=true;
      else if(c===','){row.push(field);field='';}
      else if(c==='\r'){/*skip*/}
      else if(c==='\n'){row.push(field);rows.push(row);row=[];field='';}
      else field+=c;
    }
  }
  if(field.length||row.length){row.push(field);rows.push(row);}
  return rows.filter(r=>r.length>1||(r[0]&&r[0].trim()!==''));
}

async function fetchCSV(url){
  const res=await fetch(url);
  if(!res.ok) throw new Error('HTTP '+res.status);
  const text=await res.text();
  return parseCSV(text);
}

function norm(s){return (s||'').toString().trim();}

function parseDateBR(s){
  s=norm(s);
  const m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(!m) return null;
  return new Date(+m[3], +m[2]-1, +m[1]);
}
function dkey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function keyToDate(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);}
function fmtDateBR(d){return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();}
function isWeekend(d){const w=d.getDay();return w===0||w===6;}

// Regional/Empresa: "Reg 1" / "Reg 2" = interna | "Reg 1 - Empresa" / "Reg 2 - Empresa" = terceirizada
function parseRegional(raw){
  raw=norm(raw);
  const m=raw.match(/^Reg\s*(\d+)\s*(?:-\s*(.+))?$/i);
  if(!m) return {regional:raw||'—',tipo:'—',empresa:null};
  const n=m[1];
  const empresa=m[2]?m[2].trim():null;
  return {
    regional:'Regional '+n,
    tipo: empresa? 'Terceirizada' : 'Interna',
    empresa: empresa
  };
}

function mode(arr){
  const c={};let best=null,bestN=0;
  arr.forEach(v=>{if(!v)return;c[v]=(c[v]||0)+1;if(c[v]>bestN){bestN=c[v];best=v;}});
  return best;
}

async function loadAll(){
  document.getElementById('sDot').className='dot';
  document.getElementById('sTxt').textContent='Conectando...';
  document.getElementById('mc').innerHTML='<div class="loading"><div class="spinner"></div>Carregando dados da planilha...</div>';
  try{
    const [apiRows,equipesRows,metaRows]=await Promise.all([
      fetchCSV(CSVS.api), fetchCSV(CSVS.equipes), fetchCSV(CSVS.meta)
    ]);
    process(apiRows,equipesRows,metaRows);
    document.getElementById('sDot').className='dot';
    document.getElementById('sTxt').textContent='Conectado · '+TEAMS.length+' equipes · '+DAYROWS.length+' dia-equipe avaliados';
    render();
  }catch(e){
    document.getElementById('sDot').className='dot err';
    document.getElementById('sTxt').textContent='Erro ao carregar';
    document.getElementById('mc').innerHTML=`<div class="err-box">
      <b>Não foi possível carregar a planilha automaticamente.</b><br><br>
      Isso normalmente acontece quando a planilha não está com o compartilhamento "Qualquer pessoa com o link pode visualizar", o que impede a leitura via navegador (CORS/login).<br><br>
      <b>Como resolver:</b> na planilha, clique em <b>Compartilhar</b> → em "Acesso geral" selecione <b>"Qualquer pessoa com o link"</b> com permissão de <b>Leitor</b> → Concluído. Depois clique em "Atualizar" acima.<br><br>
      Detalhe técnico: ${e.message}
    </div>`;
  }
}

function process(apiRows,equipesRows,metaRows){
  // ---- Meta: Classe (col B / idx1) -> Média (col C / idx2) ----
  const metaMap={};
  metaRows.slice(1).forEach(r=>{
    const classe=norm(r[1]); const media=parseFloat(norm(r[2]).replace(',','.'));
    if(classe && !isNaN(media)) metaMap[classe]=media;
  });

  // ---- Equipes: E(idx4)=Regional texto, F(idx5)=Nome Equipe - Kartado, G(idx6)=Responsável ----
  const equipeInfo={}; // key: nome equipe kartado -> {responsavel}
  equipesRows.slice(1).forEach(r=>{
    const nomeKartado=norm(r[5]);
    const responsavel=norm(r[6]);
    if(nomeKartado) equipeInfo[nomeKartado]={responsavel: responsavel||'Não informado'};
  });

  // ---- API: find header indices dynamically ----
  const header=apiRows[0].map(h=>norm(h));
  const idxOf=(name,fallback)=>{const i=header.findIndex(h=>h.toLowerCase()===name.toLowerCase());return i>=0?i:fallback;};
  const iData=idxOf('Data (Executado)',1);
  const iEquipe=idxOf('Equipe',2);
  const iClasse=idxOf('Classe',3);
  const iRegional=idxOf('Regional',9);

  // group raw executions
  const byTeamDay={}; // key: equipe|||dkey -> count
  const teamRegionalVotes={}; // equipe -> [] regional raw strings
  const teamClasseVotes={}; // equipe -> [] classes
  const teamMinDate={}; // equipe -> primeira data com apontamento
  let minDate=null,maxDate=null;

  apiRows.slice(1).forEach(r=>{
    const equipe=norm(r[iEquipe]);
    if(!equipe) return;
    const d=parseDateBR(r[iData]);
    if(!d) return;
    const classe=norm(r[iClasse]);
    const regionalRaw=norm(r[iRegional]);
    const key=equipe+'|||'+dkey(d);
    byTeamDay[key]=(byTeamDay[key]||0)+1;
    (teamRegionalVotes[equipe]=teamRegionalVotes[equipe]||[]).push(regionalRaw);
    (teamClasseVotes[equipe]=teamClasseVotes[equipe]||[]).push(classe);
    if(!teamMinDate[equipe]||d<teamMinDate[equipe]) teamMinDate[equipe]=d;
    if(!minDate||d<minDate) minDate=d;
    if(!maxDate||d>maxDate) maxDate=d;
  });

  const teamNames=Object.keys(teamRegionalVotes);
  TEAMS=teamNames.map(eq=>{
    const regRaw=mode(teamRegionalVotes[eq]);
    const {regional,tipo,empresa}=parseRegional(regRaw);
    const classePrimaria=mode(teamClasseVotes[eq]);
    const meta=metaMap[classePrimaria];
    const info=equipeInfo[eq];
    return {
      equipe:eq,
      responsavel: info? info.responsavel : 'Não mapeado',
      regional, tipo, empresa,
      classePrimaria: classePrimaria||'—',
      meta: (meta!==undefined? meta: null),
      minDate: teamMinDate[eq]
    };
  }).sort((a,b)=>a.equipe.localeCompare(b.equipe));

  // build weekday range rows per team — cada equipe começa a ser avaliada a partir
  // do SEU primeiro apontamento, não do início de toda a planilha
  DAYROWS=[];
  if(minDate&&maxDate){
    TEAMS.forEach(t=>{
      const inicio=t.minDate||minDate;
      for(let d=new Date(inicio); d<=maxDate; d.setDate(d.getDate()+1)){
        if(isWeekend(d)) continue;
        const dd=new Date(d);
        const key=t.equipe+'|||'+dkey(dd);
        const apontamentos=byTeamDay[key]||0;
        let status;
        if(t.meta===null) status='Sem meta';
        else status = apontamentos>=t.meta ? 'Cumprida' : 'Alerta';
        DAYROWS.push({
          equipe:t.equipe, responsavel:t.responsavel, regional:t.regional, tipo:t.tipo, empresa:t.empresa,
          data:new Date(dd), classe:t.classePrimaria, apontamentos, meta:t.meta, status
        });
      }
    });
  }
  DAYROWS.sort((a,b)=> b.data-a.data || a.equipe.localeCompare(b.equipe));
}

function applyF(){
  AF.reg=document.getElementById('fReg').value;
  AF.tipo=document.getElementById('fTipo').value;
  AF.resp=document.getElementById('fResp').value;
  AF.equipe=document.getElementById('fEquipe').value;
  const fd=document.getElementById('fData');
  if(fd) SEL_DATE=fd.value;
  render();
}
function clearF(){
  AF={reg:'all',tipo:'all',resp:'all',equipe:'all'};SEL_DATE=null;render();
}

function render(){
  const regs=[...new Set(TEAMS.map(t=>t.regional))].sort();
  const resps=[...new Set(TEAMS.map(t=>t.responsavel))].sort();
  const equipesList=[...new Set(TEAMS.map(t=>t.equipe))].sort();

  // base: filtrada por Regional/Tipo/Encarregado/Equipe — alimenta KPIs, gráficos e tabela (todos consistentes)
  let base=DAYROWS.filter(r=>{
    if(AF.reg!=='all'&&r.regional!==AF.reg) return false;
    if(AF.tipo!=='all'&&r.tipo!==AF.tipo) return false;
    if(AF.resp!=='all'&&r.responsavel!==AF.resp) return false;
    if(AF.equipe!=='all'&&r.equipe!==AF.equipe) return false;
    return true;
  });

  const total=base.length;
  const alertas=base.filter(r=>r.status==='Alerta').length;
  const cumpridas=base.filter(r=>r.status==='Cumprida').length;
  const semMeta=base.filter(r=>r.status==='Sem meta').length;
  const avaliaveis=cumpridas+alertas;
  const pctCump = avaliaveis? Math.round(cumpridas/avaliaveis*100) : 0;

  // Tabela: mostra todos os dias avaliados dentro do filtro atual
  let fil=base;

  // Última data (dentro dos filtros ativos) e equipes pendentes nesse dia
  const allDateKeys=[...new Set(DAYROWS.map(r=>dkey(r.data)))].sort().reverse();
  if(!SEL_DATE || !allDateKeys.includes(SEL_DATE)) SEL_DATE=allDateKeys[0]||null;
  const rowsNoDia=base.filter(r=>dkey(r.data)===SEL_DATE);
  const pendentes=rowsNoDia.filter(r=>r.apontamentos===0).sort((a,b)=>a.equipe.localeCompare(b.equipe));
  const fizeram=rowsNoDia.filter(r=>r.apontamentos>0).length;

  // Apontamentos por equipe NA DATA SELECIONADA
  const equipeDiaList=rowsNoDia.filter(r=>r.apontamentos>0).sort((a,b)=>b.apontamentos-a.apontamentos);

  const regListLen=[...new Set(rowsNoDia.map(r=>r.regional))].length||1;
  const tipoListLen=[...new Set(rowsNoDia.map(r=>r.tipo))].length||1;

  document.getElementById('mc').innerHTML=`
  <div class="kpi-row">
    <div class="kpi"><div class="kpi-label">Equipes Monitoradas</div><div class="kpi-value">${TEAMS.length}</div><div class="kpi-badge bb">${regs.length} regionais</div></div>
    <div class="kpi"><div class="kpi-label">Dia-Equipe Avaliados</div><div class="kpi-value">${total}</div><div class="kpi-badge bg">dias úteis, sem fins de semana</div></div>
    <div class="kpi"><div class="kpi-label">Alertas Ativos</div><div class="kpi-value">${alertas}</div><div class="kpi-badge br">meta não atingida</div></div>
    <div class="kpi"><div class="kpi-label">Cumprimento de Meta</div><div class="kpi-value">${pctCump}<span>%</span></div><div class="kpi-badge bn">${cumpridas} de ${avaliaveis} avaliados</div></div>
  </div>

  <div class="filters">
    <span class="fl">Filtros:</span>
    <select id="fReg" onchange="applyF()"><option value="all">Todas as regionais</option>${regs.map(r=>`<option value="${r}"${AF.reg===r?' selected':''}>${r}</option>`).join('')}</select>
    <select id="fTipo" onchange="applyF()"><option value="all">Interna e Terceirizada</option><option value="Interna"${AF.tipo==='Interna'?' selected':''}>Interna</option><option value="Terceirizada"${AF.tipo==='Terceirizada'?' selected':''}>Terceirizada</option></select>
    <select id="fResp" onchange="applyF()"><option value="all">Todos os encarregados</option>${resps.map(r=>`<option value="${r}"${AF.resp===r?' selected':''}>${r}</option>`).join('')}</select>
    <select id="fEquipe" onchange="applyF()"><option value="all">Todas as equipes</option>${equipesList.map(e=>`<option value="${e}"${AF.equipe===e?' selected':''}>${e}</option>`).join('')}</select>
    <select id="fData" onchange="applyF()">${allDateKeys.map(k=>{const [y,m,dd]=k.split('-');return `<option value="${k}"${SEL_DATE===k?' selected':''}>${dd}/${m}/${y}</option>`;}).join('')}</select>
    <button class="fc" onclick="clearF()">Limpar</button>
    <span class="fcount">${fil.length} de ${total} registros na tabela</span>
  </div>

  <div class="cb" style="border-color:${pendentes.length?'rgba(248,113,113,0.5)':'#3d48c0'}">
    <div class="ct">${pendentes.length?'⚠ ':''}Situação em ${SEL_DATE?fmtDateBR(keyToDate(SEL_DATE)):'—'} <span style="color:#7888c0;font-weight:400;text-transform:none">(escolha a data no filtro acima)</span></div>
    <div class="cs">${rowsNoDia.length? `${fizeram} de ${rowsNoDia.length} equipe(s) filtradas já registraram apontamento nesta data` : 'Nenhuma equipe filtrada tinha meta ativa nesta data'}</div>
    ${pendentes.length? `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">${pendentes.map(p=>`<span class="bs salert" title="${p.responsavel} · ${p.regional}">${p.equipe}</span>`).join('')}</div>` : (rowsNoDia.length? `<div style="margin-top:8px;color:#4ade80;font-size:12px">✓ Todas as equipes filtradas já registraram apontamento nesta data</div>`:'')}
  </div>

  <div class="cb" style="margin-top:12px;margin-bottom:0">
    <div class="ct">Apontamentos por Equipe em ${SEL_DATE?fmtDateBR(keyToDate(SEL_DATE)):'—'}</div><div class="cs">Apontamentos realizados nesta data específica, por equipe (verde = meta cumprida, vermelho = alerta)</div>
    <div class="tw" style="max-height:320px">
      <div style="position:relative;height:${Math.max(120,equipeDiaList.length*22)}px"><canvas id="cEquipe">.</canvas></div>
    </div>
    ${!equipeDiaList.length? `<div class="empty">Nenhuma equipe filtrada registrou apontamento nesta data.</div>`:''}
  </div>

  <div class="g2">
    <div class="cb" style="margin-bottom:0">
      <div class="ct">Cumprimento de Meta por Regional em ${SEL_DATE?fmtDateBR(keyToDate(SEL_DATE)):'—'}</div><div class="cs">% de equipes com meta cumprida vs alerta nesta data</div>
      <div class="leg" id="leg1"></div>
      <div style="position:relative;height:${Math.max(120,regListLen*46)}px"><canvas id="cRegPct">.</canvas></div>
    </div>
    <div class="cb" style="margin-bottom:0">
      <div class="ct">Cumprimento de Meta por Tipo em ${SEL_DATE?fmtDateBR(keyToDate(SEL_DATE)):'—'}</div><div class="cs">Interna vs Terceirizada, nesta data</div>
      <div class="leg" id="leg2"></div>
      <div style="position:relative;height:${Math.max(120,tipoListLen*46)}px"><canvas id="cTipoPct">.</canvas></div>
    </div>
  </div>

  <div class="cb">
    <div class="ct">Detalhamento — Meta por Equipe / Dia</div><div class="cs">Exibindo todos os dias úteis avaliados dentro dos filtros ativos — ${fil.length} registros</div>
    <div class="tw">
      <table>
        <thead><tr><th>Data</th><th>Equipe</th><th>Encarregado</th><th>Regional</th><th>Tipo</th><th>Classe (referência)</th><th style="text-align:right">Apontamentos</th><th style="text-align:right">Meta/dia</th><th>Status</th></tr></thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
  </div>`;

  if(!TEAMS.length){
    document.getElementById('mc').innerHTML+=`<div class="empty">Nenhum dado encontrado. Verifique se a aba API possui registros com Data (Executado) preenchida.</div>`;
    return;
  }

  // ---- Cumprimento % por Regional NA DATA SELECIONADA (barra 100% empilhada) ----
  const regList=[...new Set(rowsNoDia.map(r=>r.regional))].sort();
  const regStats=regList.map(r=>{
    const rows=rowsNoDia.filter(x=>x.regional===r);
    const c=rows.filter(x=>x.status==='Cumprida').length, a=rows.filter(x=>x.status==='Alerta').length;
    const tot=c+a;
    return {c: tot? Math.round(c/tot*100):0, a: tot? Math.round(a/tot*100):0};
  });
  const leg1=document.getElementById('leg1');
  leg1.innerHTML=`<span><span class="ld" style="background:#4ade80"></span>Cumprida</span><span><span class="ld" style="background:#f87171"></span>Alerta</span>`;
  CH.regPct&&CH.regPct.destroy();
  CH.regPct=new Chart(document.getElementById('cRegPct'),{type:'bar',data:{labels:regList,datasets:[
    {label:'Cumprida',data:regStats.map(s=>s.c),backgroundColor:'#4ade80cc',borderColor:'#4ade80',borderWidth:1.5},
    {label:'Alerta',data:regStats.map(s=>s.a),backgroundColor:'#f87171cc',borderColor:'#f87171',borderWidth:1.5}
  ]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${c.parsed.x}%`}}},scales:{x:{stacked:true,max:100,ticks:{color:TC,font:{size:11},callback:v=>v+'%'},grid:{color:GC}},y:{stacked:true,ticks:{color:TC,font:{size:11}},grid:{color:GC}}}}});

  // ---- Cumprimento % por Tipo NA DATA SELECIONADA (barra 100% empilhada) ----
  const tipoList=[...new Set(rowsNoDia.map(r=>r.tipo))].sort();
  const tipoStats=tipoList.map(t=>{
    const rows=rowsNoDia.filter(x=>x.tipo===t);
    const c=rows.filter(x=>x.status==='Cumprida').length, a=rows.filter(x=>x.status==='Alerta').length;
    const tot=c+a;
    return {c: tot? Math.round(c/tot*100):0, a: tot? Math.round(a/tot*100):0};
  });
  const leg2=document.getElementById('leg2');
  leg2.innerHTML=`<span><span class="ld" style="background:#4ade80"></span>Cumprida</span><span><span class="ld" style="background:#f87171"></span>Alerta</span>`;
  CH.tipoPct&&CH.tipoPct.destroy();
  CH.tipoPct=new Chart(document.getElementById('cTipoPct'),{type:'bar',data:{labels:tipoList,datasets:[
    {label:'Cumprida',data:tipoStats.map(s=>s.c),backgroundColor:'#4ade80cc',borderColor:'#4ade80',borderWidth:1.5},
    {label:'Alerta',data:tipoStats.map(s=>s.a),backgroundColor:'#f87171cc',borderColor:'#f87171',borderWidth:1.5}
  ]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${c.parsed.x}%`}}},scales:{x:{stacked:true,max:100,ticks:{color:TC,font:{size:11},callback:v=>v+'%'},grid:{color:GC}},y:{stacked:true,ticks:{color:TC,font:{size:11}},grid:{color:GC}}}}});

  // ---- Apontamentos por equipe NA DATA SELECIONADA (cor = status daquele dia) ----
  CH.equipe&&CH.equipe.destroy();
  const eqLabels=equipeDiaList.map(r=>r.equipe);
  const eqValues=equipeDiaList.map(r=>r.apontamentos);
  const eqColors=equipeDiaList.map(r=>r.status==='Cumprida'?'#4ade80':'#f87171');
  CH.equipe=new Chart(document.getElementById('cEquipe'),{type:'bar',data:{labels:eqLabels,datasets:[{data:eqValues,backgroundColor:eqColors.map(c=>c+'cc'),borderColor:eqColors,borderWidth:1.5,borderRadius:4}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:TC,font:{size:11},precision:0},grid:{color:GC},beginAtZero:true},y:{ticks:{color:TC,font:{size:10}},grid:{color:GC}}}}});

  // Tabela
  const tb=document.getElementById('tb');
  tb.innerHTML='';
  fil.slice(0,1000).forEach(r=>{
    const rc=r.regional==='Regional 1'?'r1':'r2';
    const tc=r.tipo==='Interna'?'ti':'tt2';
    const sc=r.status==='Cumprida'?'sok':r.status==='Alerta'?'salert':'snm';
    tb.innerHTML+=`<tr>
      <td>${fmtDateBR(r.data)}</td>
      <td>${r.equipe}</td>
      <td>${r.responsavel}</td>
      <td><span class="bs ${rc}">${r.regional}</span></td>
      <td><span class="bs ${tc}">${r.tipo}${r.empresa?' · '+r.empresa:''}</span></td>
      <td>${r.classe}</td>
      <td style="text-align:right;font-weight:600">${r.apontamentos}</td>
      <td style="text-align:right">${r.meta!==null?r.meta:'—'}</td>
      <td><span class="bs ${sc}">${r.status}</span></td>
    </tr>`;
  });
  if(!fil.length){
    tb.innerHTML=`<tr><td colspan="9"><div class="empty">Nenhum registro para os filtros selecionados.</div></td></tr>`;
  }
}

loadAll();
</script>
